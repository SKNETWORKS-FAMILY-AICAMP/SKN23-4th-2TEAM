server {
    listen 80;
    server_name _;
    # Default is 1MB. Raise for PDF + markdown multipart payloads.
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: 정적 파일이 없으면 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Django API 프록시 (backend-hub:8000)
    location /api/admin {
        proxy_pass         http://backend-hub:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /api/v1/dashboard {
        proxy_pass         http://backend-hub:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /api/v1/logs {
        proxy_pass         http://backend-hub:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # FastAPI 프록시 (backend-worker-api:8001)
    location /api/v1/admin-ai {
        proxy_pass         http://backend-worker-api:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /api/v1/rag {
        proxy_pass         http://backend-worker-api:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
