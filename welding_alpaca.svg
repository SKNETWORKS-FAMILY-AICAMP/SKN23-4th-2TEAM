<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <clipPath id="clip-al"><circle cx="200" cy="200" r="195"/></clipPath>
    <linearGradient id="bg-al" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F5E9"/><stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="195" fill="url(#bg-al)" stroke="#2E7D32" stroke-width="5"/>
  <g clip-path="url(#clip-al)">
    <!-- Welding leather apron -->
    <rect x="105" y="270" width="190" height="170" rx="12" fill="#5D4037"/>
    <rect x="115" y="270" width="170" height="170" rx="8" fill="#795548"/>
    <!-- Stitching -->
    <line x1="135" y1="280" x2="135" y2="440" stroke="#4E342E" stroke-width="1.5" stroke-dasharray="6,4"/>
    <line x1="265" y1="280" x2="265" y2="440" stroke="#4E342E" stroke-width="1.5" stroke-dasharray="6,4"/>
    <!-- Straps -->
    <line x1="150" y1="270" x2="168" y2="245" stroke="#4E342E" stroke-width="6" stroke-linecap="round"/>
    <line x1="250" y1="270" x2="232" y2="245" stroke="#4E342E" stroke-width="6" stroke-linecap="round"/>
    <!-- Under shirt -->
    <rect x="85" y="250" width="230" height="30" rx="10" fill="#455A64"/>
    <!-- Apron pocket -->
    <rect x="155" y="325" width="90" height="45" rx="5" fill="#4E342E"/>
    <line x1="155" y1="325" x2="245" y2="325" stroke="#3E2723" stroke-width="2"/>
    <!-- Welding rod sticking out of pocket -->
    <line x1="220" y1="325" x2="230" y2="295" stroke="#90A4AE" stroke-width="3" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="178" y="225" width="44" height="50" rx="10" fill="#FFF8E1"/>

    <!-- Fluffy head wool -->
    <circle cx="200" cy="128" r="48" fill="#FAFAFA"/>
    <circle cx="175" cy="118" r="24" fill="#F5F5F5"/>
    <circle cx="225" cy="118" r="24" fill="#F5F5F5"/>
    <circle cx="200" cy="108" r="28" fill="#EEEEEE"/>
    <circle cx="185" cy="103" r="18" fill="#F5F5F5"/>
    <circle cx="215" cy="103" r="18" fill="#F5F5F5"/>
    <circle cx="200" cy="93" r="20" fill="#FAFAFA"/>

    <!-- Face -->
    <ellipse cx="200" cy="190" rx="52" ry="60" fill="#FFF8E1"/>

    <!-- Ears -->
    <ellipse cx="147" cy="132" rx="11" ry="28" fill="#FFF8E1" transform="rotate(-20 147 132)"/>
    <ellipse cx="147" cy="132" rx="6" ry="18" fill="#FFCCBC" transform="rotate(-20 147 132)"/>
    <ellipse cx="253" cy="132" rx="11" ry="28" fill="#FFF8E1" transform="rotate(20 253 132)"/>
    <ellipse cx="253" cy="132" rx="6" ry="18" fill="#FFCCBC" transform="rotate(20 253 132)"/>

    <!-- Eyes -->
    <ellipse cx="180" cy="185" rx="9" ry="10" fill="#1B1B1B"/>
    <circle cx="183" cy="182" r="3.5" fill="white"/>
    <ellipse cx="220" cy="185" rx="9" ry="10" fill="#1B1B1B"/>
    <circle cx="223" cy="182" r="3.5" fill="white"/>

    <!-- Nose -->
    <ellipse cx="200" cy="212" rx="14" ry="9" fill="#FFCCBC"/>
    <ellipse cx="194" cy="212" rx="4" ry="3" fill="#A1887F"/>
    <ellipse cx="206" cy="212" rx="4" ry="3" fill="#A1887F"/>

    <!-- Mouth -->
    <path d="M193 222 Q200 230 207 222" fill="none" stroke="#A1887F" stroke-width="2" stroke-linecap="round"/>

    <!-- Blush -->
    <ellipse cx="163" cy="205" rx="11" ry="6" fill="#FFCDD2" opacity="0.5"/>
    <ellipse cx="237" cy="205" rx="11" ry="6" fill="#FFCDD2" opacity="0.5"/>

    <!-- Welding helmet (pushed up) -->
    <rect x="128" y="82" width="144" height="52" rx="14" fill="#263238"/>
    <rect x="133" y="84" width="134" height="45" rx="11" fill="#37474F"/>
    <!-- Visor -->
    <rect x="150" y="72" width="100" height="38" rx="7" fill="#1B5E20" opacity="0.85"/>
    <rect x="157" y="77" width="86" height="28" rx="4" fill="#2E7D32" opacity="0.6"/>
    <!-- Hinges -->
    <circle cx="150" cy="93" r="4.5" fill="#455A64"/>
    <circle cx="250" cy="93" r="4.5" fill="#455A64"/>
    <!-- Headband -->
    <path d="M128 116 Q200 130 272 116" fill="none" stroke="#FFC107" stroke-width="3"/>

    <!-- Sparks -->
    <circle cx="75" cy="320" r="2.5" fill="#FFEB3B" opacity="0.8"/>
    <circle cx="85" cy="305" r="2" fill="#FF9800" opacity="0.7"/>
    <circle cx="68" cy="335" r="2" fill="#FFC107" opacity="0.9"/>
  </g>
</svg>