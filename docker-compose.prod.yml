# =============================================================
# docker-compose.prod.yml  ─  SKN23-4th-2TEAM 운영환경 통합 오케스트레이션 (SSH 터널 제거 버전)
# =============================================================
# 실행 (기본 docker-compose.yml 대신 이 파일 사용):
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# 주요 차이점 (AWS 내부 배포용):
#   - SSH 터널 컨테이너(ssh-tunnel) 완전 제거 (RDS와 직접 통신)
#   - .env.docker 대신 .env 파일만 직접 사용하여 원본 DB_HOST(RDS 엔드포인트)로 연결
#   - 백엔드 내부 터널링 비활성화를 위해 SSH_TUNNEL_ENABLED: "false" 강제 주입
#   - 프론트엔드 Nginx 배포 모드(prod) 적용 및 포트 분리 (Admin:80, Worker:8080)
# =============================================================

version: "3.9"

# ── 공통 환경 변수 앵커 ────────────────────────────────────────
x-backend-env: &backend-env
  PYTHONPATH: /app/backend_ai:/app
  PYTHONUNBUFFERED: "1"
  SSH_TUNNEL_ENABLED: "false"    # 앱 내부에서 터널을 여려는 시도 차단

# ── 공통 재시작 정책 ────────────────────────────────────────────
x-restart: &restart-policy
  restart: unless-stopped

services:

  # ── 1. Django Backend Hub ─────────────────────────────────────
  backend-hub:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: skn_backend_hub_prod
    <<: *restart-policy
    env_file:
      - .env      # 이 곳의 DB_HOST가 이제 RDS 주소를 가리킴 (.env.docker 사용 안 함)
    environment:
      <<: *backend-env
    command: >
      sh -c "
        echo '✅ DB connection ready. Running migrations...' &&
        python manage.py migrate --noinput &&
        echo '🚀 Starting Django...' &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
      "
    working_dir: /app/backend_hub
    ports:
      - "8000:8000"
    volumes:
      - models_cache:/app/models
      - bm25_cache:/app/backend_ai/bm25_data
      - data_vol:/app/data
      - logs_vol:/app/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-o", "/dev/null", "-w", "%{http_code}", "http://localhost:8000/admin/"]
      interval: 20s
      timeout: 8s
      start_period: 60s
      retries: 5

  # ── 2. FastAPI Worker API ─────────────────────────────────────
  backend-worker-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: skn_worker_api_prod
    <<: *restart-policy
    env_file:
      - .env
    environment:
      <<: *backend-env
    command: >
      sh -c "
        echo '✅ DB connection ready. Starting FastAPI...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8001
      "
    working_dir: /app/backend_worker_api
    ports:
      - "8001:8001"
    volumes:
      - models_cache:/app/models
      - bm25_cache:/app/backend_ai/bm25_data
      - data_vol:/app/data
      - logs_vol:/app/logs
      - uploads_vol:/app/backend_worker_api/uploads
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 20s
      timeout: 8s
      start_period: 90s   # AI 모델 로딩 시간 감안
      retries: 6

  # ── 3. Admin Frontend (Nginx Prod) ─────────────────────────
  frontend-admin:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: prod                   # Nginx
      args:
        APP_DIR: frontend_admin
        VITE_PORT: "80"
    container_name: skn_frontend_admin_prod
    <<: *restart-policy
    ports:
      - "80:80"                      # Admin 서버
    networks:
      - app-network
    depends_on:
      - backend-hub
      - backend-worker-api

  # ── 4. Worker Frontend (Nginx Prod) ────────────────────────
  frontend-worker:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: prod                   # Nginx
      args:
        APP_DIR: frontend_worker
        VITE_PORT: "80"
    container_name: skn_frontend_worker_prod
    <<: *restart-policy
    ports:
      - "8080:80"                    # Worker 서버
    networks:
      - app-network
    depends_on:
      - backend-worker-api

# ── 네트워크 ──────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge

# ── 볼륨 (재빌드 시에도 캐시 유지) ───────────────────────────
volumes:
  models_cache:
    driver: local
  bm25_cache:
    driver: local
  data_vol:
    driver: local
  logs_vol:
    driver: local
  uploads_vol:
    driver: local
